name: pages
on:
  push:
    branches: [master]

jobs:
  publish:
    runs-on: docker
    container:
      image: rust:1.85-slim
    steps:
      - name: Install prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates
      - uses: actions/checkout@v4
      - name: Install mdbook
        run: cargo install --locked mdbook --version ^0.4
      - name: Build site
        run: mdbook build
      - uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://hellonoel.codeberg.page/AIexandria/
          token: ${{ forge.token }}
          source: book/
