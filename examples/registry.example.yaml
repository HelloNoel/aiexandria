# Example AIexandria registry. Point AIexandria at this with --registry.
indexes:
  rust-book:
    description: "The Rust Programming Language book"
    repo:
      url: https://github.com/rust-lang/book.git
      branch: main
    path: pinakes.yaml
    # Re-fetch this repo at most once an hour. Accepts humantime ("5m", "24h",
    # "1d") or "never". If unset, the --refresh CLI default applies.
    refresh: 1h

  internal-platform:
    description: "Internal platform docs (private)"
    repo:
      url: git@github.example.com:platform/docs.git
      branch: main
      # token will be looked up via auth config (see auth.example.yaml),
      # or override here:
      token_env: PLATFORM_DOCS_TOKEN
    path: docs/pinakes.yaml
    refresh: 15m
