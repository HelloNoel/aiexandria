version: 1
name: AIexandria v0.4.0
description: >
  AIexandria v0.4.0 user guide: installation, public defaults, custom registries, ranked and global search, repository updates, and troubleshooting.
entries:
  - id: getting-started
    name: Getting started
    description: Install, connect an MCP client, and read the public defaults.
    kind: doc
    path: docs/getting-started.md
  - id: installation
    name: Installation and MCP clients
    description: Download binaries; macOS, Linux, Windows, Codex, and Claude Code setup.
    kind: doc
    path: docs/installation.md
  - id: adding-documentation
    name: Add documentation
    description: Custom registries, private docs, and cross-repository collections.
    kind: doc
    path: docs/adding-documentation.md
  - id: source-discovery
    name: Find information
    description: Discover sources, choose a version, search, read excerpts, and handle refresh deadlines.
    kind: doc
    path: docs/source-discovery.md
  - id: writing-indexes
    name: Write useful indexes
    description: Generate Pinakes indexes, descriptions, composition, and optional search commands.
    kind: doc
    path: docs/writing-indexes.md
  - id: configuration
    name: Configuration and troubleshooting
    description: Registry precedence, authentication, cache paths, refresh, and SHA-256 support.
    kind: doc
    path: docs/configuration.md
  - id: reference
    name: Reference
    description: CLI options, environment variables, and seven MCP tools.
    kind: doc
    path: docs/reference.md
  - id: updating
    name: Prepare and update repositories
    description: Prewarm sources, share refresh jobs, schedule updates with cron, systemd or launchd.
    kind: doc
    path: docs/updating.md

  - id: semantic-search
    name: Semantic search
    description: Keyword, semantic, hybrid and global passages; local providers, corpus filters, cache coverage and fallback.
    kind: doc
    path: docs/semantic-search.md
