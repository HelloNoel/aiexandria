[package]
name = "aiexandria"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "MCP server that gives LLMs hierarchical access to git-hosted documentation"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-openssl"] }
url = "2"
sha2 = "0.11"
hex = "0.4"
dirs = "6"
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
humantime-serde = "1"
humantime = "2"
regex = "1"
shell-words = "1"
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }

[dev-dependencies]
tempfile = "3"
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-openssl"] }
serde_json = "1"
