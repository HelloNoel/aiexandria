[package]
name = "aiexandria"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "MCP server that gives LLMs hierarchical access to git-hosted documentation"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
git2 = { version = "0.21", default-features = false, features = ["https", "ssh", "vendored-openssl"] }
url = "2"
percent-encoding = "2"
sha2 = "0.11"
hex = "0.4"
dirs = "7"
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
humantime-serde = "1"
humantime = "2"
regex = "1"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }
tempfile = "3"
rmcp = { version = "3.8", features = ["server", "macros", "transport-io"] }

[dev-dependencies]
git2 = { version = "0.21", default-features = false, features = ["https", "ssh", "vendored-openssl"] }
serde_json = "1"
