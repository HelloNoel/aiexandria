name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux test dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install macOS test dependency
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-perl make perl
      - name: Build and test Unix
        if: runner.os != 'Windows'
        run: |
          cargo test --locked --target ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Build and test Windows GNU
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cargo test --locked --target ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/package.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/release/*
  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist/release
          sha256sum *.tar.gz *.zip > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "AIexandria $RELEASE_TAG" --notes-file ../../release-notes.md
          gh release upload "$RELEASE_TAG" *.tar.gz *.zip SHA256SUMS
