name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux test dependency
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git ripgrep
      - name: Install macOS test dependency
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: git --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
        if: runner.os != 'Windows'
      # Git-heavy fixtures contend on Windows; concurrency regressions spawn
      # their own workers and still run with this harness limit.
      - run: cargo test --locked -- --test-threads=2
        if: runner.os == 'Windows'
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install mdbook --version 0.5.4 --locked
      - run: mdbook build

  git-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build supported Git baseline
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libexpat1-dev zlib1g-dev ripgrep
          curl -fsSL https://www.kernel.org/pub/software/scm/git/git-2.43.7.tar.xz -o "$RUNNER_TEMP/git.tar.xz"
          echo "657e2374455d9e62f6cdb3e7c55d867b6db5404d744e97e112cc5b0db687a19f  $RUNNER_TEMP/git.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/git.tar.xz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/git-2.43.7" -j2 prefix="$RUNNER_TEMP/git-baseline" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease install
          echo "$RUNNER_TEMP/git-baseline/bin" >> "$GITHUB_PATH"
      - run: git --version
      - run: cargo test --locked
