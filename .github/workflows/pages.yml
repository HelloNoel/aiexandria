name: Pages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Released documentation tag
        default: v0.3.0
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.release.tag_name != 'v0.1.0' && github.event.release.tag_name != 'v0.2.0')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install mdbook --version 0.5.4 --locked
      - uses: actions/configure-pages@v5
      - run: mdbook build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book
      - uses: actions/deploy-pages@v4
        id: deployment
