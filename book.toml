[book]
title = "AIexandria"
description = "MCP server that gives LLMs hierarchical access to git-hosted documentation"
authors = ["Noel Chia"]
language = "en"
src = "docs"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
site-url = "/aiexandria/"
git-repository-url = "https://github.com/HelloNoel/aiexandria"
edit-url-template = "https://github.com/HelloNoel/aiexandria/edit/main/docs/{path}"

[output.html.fold]
enable = true
level = 1
