[book]
title = "AIexandria"
description = "MCP server that gives LLMs hierarchical access to git-hosted documentation"
authors = ["Noel Chia"]
language = "en"
src = "docs"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
site-url = "/AIexandria/"
git-repository-url = "https://codeberg.org/HelloNoel/AIexandria"
edit-url-template = "https://codeberg.org/HelloNoel/AIexandria/_edit/master/docs/{path}"

[output.html.fold]
enable = true
level = 1
